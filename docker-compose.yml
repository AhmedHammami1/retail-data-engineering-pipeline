
services:

  # PostgreSQL Data Warehouse
  database:
    image: postgres:18
    container_name: retail_database
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Python ETL Application
  etl:
    build: .
    container_name: retail_etl
    restart: "no"

    env_file:
      - .env

    environment:
      DB_HOST: database
      DB_PORT: 5432

    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed

    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
